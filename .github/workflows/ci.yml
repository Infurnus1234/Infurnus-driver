name: Driver CI
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  driver:
    # Existing approved golden baselines were rendered on Windows.
    # Keep exact comparisons on that host; never relax pixel thresholds.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Setup Java for Android
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Select Android Java toolchain
        shell: pwsh
        run: flutter config --jdk-dir="$env:JAVA_HOME"
      - name: Secret and private-artifact scan
        run: node scripts/check-source-secrets.js
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Configure Android test resources
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.DRIVER_ANDROID_GOOGLE_SERVICES_JSON }}
        run: node scripts/configure-ci-firebase.mjs
      - name: Configure Android SDK path
        shell: pwsh
        run: |
          $candidates = @($env:ANDROID_HOME, $env:ANDROID_SDK_ROOT, 'C:\Android\android-sdk', 'C:\Android\Sdk')
          $sdk = $candidates | Where-Object { $_ -and (Test-Path (Join-Path $_ 'platform-tools')) } | Select-Object -First 1
          if (!$sdk) { throw 'Android SDK with platform-tools was not found.' }
          $flutterSdk = (Get-Command flutter).Source | Split-Path -Parent | Split-Path -Parent
          $sdkProperty = $sdk -replace '\\', '/'
          $flutterProperty = $flutterSdk -replace '\\', '/'
          $lines = @("sdk.dir=$sdkProperty", "flutter.sdk=$flutterProperty")
          Set-Content -Path android/local.properties -Value $lines -Encoding ascii
          "ANDROID_HOME=$sdk" >> $env:GITHUB_ENV
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV
          flutter doctor -v
      - name: Fetch verified Gradle distribution
        shell: pwsh
        run: |
          $wrapper = 'android/gradle/wrapper/gradle-wrapper.properties'
          $properties = Get-Content -LiteralPath $wrapper
          if (-not ($properties -match '^distributionUrl=.*/gradle-8[.]14-bin[.]zip$')) { return }
          $archive = Join-Path $env:RUNNER_TEMP 'gradle-8.14-bin.zip'
          $checksum = '61ad310d3c7d3e5da131b76bbf22b5a4c0786e9d892dae8c1658d4b484de3caa'
          # Use the official release asset API when the browser download route is unavailable.
          $url = 'https://api.github.com/repos/gradle/gradle-distributions/releases/assets/249401401?download=1'
          curl.exe --fail --silent --show-error --location --retry 2 --max-time 150 --header 'Accept: application/octet-stream' --output $archive $url
          if ($LASTEXITCODE -ne 0) { throw 'Gradle download failed.' }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $checksum) {
            throw 'Gradle distribution checksum mismatch.'
          }
          $localUrl = ([Uri]$archive).AbsoluteUri
          $properties -replace '^distributionUrl=.*$', "distributionUrl=$localUrl" |
            Set-Content -LiteralPath $wrapper -Encoding ascii
          Add-Content -LiteralPath $wrapper -Value "distributionSha256Sum=$checksum" -Encoding ascii
      - name: Android debug compilation
        id: android_build
        shell: pwsh
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.DRIVER_MAPS_API_KEY || 'non-secret-ci-fixture-key' }}
        run: |
          Remove-Item Env:ANDROID_PREFS_ROOT -ErrorAction SilentlyContinue
          flutter build apk --debug --no-pub
      - name: Gradle stacktrace on Android build failure
        if: failure() && steps.android_build.conclusion == 'failure'
        continue-on-error: true
        shell: pwsh
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.DRIVER_MAPS_API_KEY || 'non-secret-ci-fixture-key' }}
        run: |
          Remove-Item Env:ANDROID_PREFS_ROOT -ErrorAction SilentlyContinue
          Set-Location android
          .\gradlew.bat :app:assembleDebug --stacktrace
