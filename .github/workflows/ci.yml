name: Driver CI
on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  driver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Secret and private-artifact scan
        run: node scripts/check-source-secrets.js
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --no-pub
      - name: Test
        run: flutter test --no-pub
      - name: Configure Android test resources
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.DRIVER_ANDROID_GOOGLE_SERVICES_JSON }}
        run: node scripts/configure-ci-firebase.mjs
      - name: Android debug compilation
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.DRIVER_MAPS_API_KEY || 'non-secret-ci-fixture-key' }}
        run: flutter build apk --debug --no-pub
