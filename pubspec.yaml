name: infurnus_driver
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+7

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^14.2.0

  # State Management
  provider: ^6.1.2

  # Utilities & Formatting
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  http: ^1.2.0
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.0
  http_parser: ^4.1.2
  image_picker: ^1.2.0
  file_picker: ^10.3.3
  mime: ^2.0.0
  geolocator: ^14.0.2
  socket_io_client: ^3.1.2

  # Cupertino Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/infurnus_logo.png

flutter_launcher_icons:
  image_path: "assets/images/infurnus_logo.png"
  android: "launcher_icon"
  ios: true
  image_path_ios: "assets/images/infurnus_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/infurnus_logo.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/infurnus_logo.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/images/infurnus_logo.png"
  ios: true
  web: false
